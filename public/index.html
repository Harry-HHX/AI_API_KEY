<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI API Key 分发平台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>AI API Key 平台</h1>

    <!-- 登录 -->
    <div id="loginSection">
      <h2>登录</h2>
      <input type="text" id="username" placeholder="用户名"><br><br>
      <input type="password" id="password" placeholder="密码"><br><br>
      <button onclick="login()">登录</button>
    </div>

    <!-- 主界面 -->
    <div id="mainSection" style="display:none;">
      <h2>使用</h2>
      <input type="text" id="apiKey" placeholder="输入你的 API Key"><br><br>

      <div class="model-section">
        <button id="loadModelsBtn" onclick="loadModels()">加载模型</button>
        <span id="modelLoading" style="display:none; margin-left: 8px;">
          <span class="spinner"></span> 请求中...
        </span>
        <select id="modelSelect" style="display:none; margin-left: 8px;">
          <option value="">-- 请选择模型 --</option>
        </select>
      </div>

      <br><br>
      <textarea id="messageInput" placeholder="输入你的问题..." rows="4" cols="50"></textarea><br><br>
      <button onclick="sendMessage()">发送</button>

      <h3>回复：</h3>
      <pre id="output"></pre>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
