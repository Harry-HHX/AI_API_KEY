<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-CHAT</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f1117; color: #e4e4e7; min-height: 100vh; }
.container { max-width: 900px; margin: 0 auto; padding: 20px; }
h1 { font-size: 24px; margin-bottom: 20px; }
h2 { font-size: 18px; margin-bottom: 12px; }
.card { background: #181b26; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
input, button, select { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #2a2d3a; background: #0f1117; color: #e4e4e7; font-size: 14px; margin-bottom: 10px; }
button { background: #4f6bff; border: none; cursor: pointer; font-weight: 600; }
button:hover { background: #3d57e8; }
.tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.tab { padding: 8px 16px; border-radius: 8px; cursor: pointer; background: #181b26; border: 1px solid #2a2d3a; }
.tab.active { background: #4f6bff; border-color: #4f6bff; }
.panel { display: none; }
.panel.active { display: block; }
.msg { padding: 10px; border-radius: 8px; margin-bottom: 8px; }
.msg.user { background: #1e2a4a; }
.msg.ai { background: #1a2a1a; }
.key-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #0f1117; border-radius: 8px; margin-bottom: 8px; }
.key-item code { font-family: monospace; font-size: 12px; color: #8b8fa3; }
.delete-btn { width: auto; padding: 4px 12px; background: #e83d3d; font-size: 12px; }
.delete-btn:hover { background: #c83232; }
.logout-btn { width: auto; padding: 8px 16px; background: #555; font-size: 14px; }
#chat-box { height: 400px; overflow-y: auto; margin-bottom: 12px; }
#chat-input { display: flex; gap: 8px; }
#chat-input input { flex: 1; }
#chat-input button { width: auto; }
</style>
</head>
<body>
<div class="container">
  <div id="login-page">
    <h1>AI-CHAT 登录</h1>
    <div class="card">
      <h2>密码登录</h2>
      <input id="login-username" placeholder="用户名">
      <input id="login-password" type="password" placeholder="密码">
      <input id="login-totp" placeholder="2FA验证码（如已开启）" style="display:none">
      <button onclick="doLogin()">登录</button>
      <p style="margin-top:10px;font-size:13px;color:#8b8fa3">没有账号？<a href="#" onclick="showRegister()" style="color:#4f6bff">注册</a></p>
    </div>
    <div class="card" id="register-form" style="display:none">
      <h2>注册</h2>
      <input id="reg-username" placeholder="用户名">
      <input id="reg-password" type="password" placeholder="密码">
      <button onclick="doRegister()">注册</button>
    </div>
    <div class="card">
      <h2>GitHub 登录</h2>
      <button onclick="window.location.href='/auth/start'">使用 GitHub 登录</button>
    </div>
  </div>

  <div id="main-page" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h1>AI-CHAT</h1>
      <button class="logout-btn" onclick="doLogout()">退出</button>
    </div>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('chat')">聊天</div>
      <div class="tab" onclick="switchTab('apikeys')">API Keys</div>
      <div class="tab" onclick="switchTab('gift')">礼品码</div>
      <div class="tab" onclick="switchTab('2fa')">2FA</div>
    </div>

    <div id="panel-chat" class="panel active">
      <div class="card">
        <select id="model-select"></select>
        <div id="chat-box"></div>
        <div id="chat-input">
          <input id="message-input" placeholder="输入消息...">
          <button onclick="sendMessage()">发送</button>
        </div>
      </div>
    </div>

    <div id="panel-apikeys" class="panel">
      <div class="card">
        <h2>我的 API Keys</h2>
        <input id="key-name" placeholder="Key 名称（可选）">
        <button onclick="createKey()">创建 API Key</button>
        <div id="keys-list" style="margin-top:12px"></div>
      </div>
    </div>

    <div id="panel-gift" class="panel">
      <div class="card">
        <h2>兑换礼品码</h2>
        <input id="gift-code" placeholder="输入礼品码">
        <button onclick="redeemGift()">兑换</button>
      </div>
    </div>

    <div id="panel-2fa" class="panel">
      <div class="card">
        <h2>两步验证 (2FA)</h2>
        <button onclick="setup2FA()">生成密钥</button>
        <div id="2fa-result" style="margin-top:10px"></div>
      </div>
    </div>
  </div>
</div>

<script>
let currentUser = null;

// 页面加载
(async function() {
  const res = await fetch('/api/me');
  const data = await res.json();
  if (data.ok) {
    currentUser = data.user;
    showMainPage();
    loadModels();
    loadKeys();
  }
})();

function showMainPage() {
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('main-page').style.display = 'block';
}

function showRegister() {
  document.getElementById('register-form').style.display = 'block';
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    const names = ['chat','apikeys','gift','2fa'];
    t.classList.toggle('active', names[i] === name);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  if (name === 'apikeys') loadKeys();
}

async function doRegister() {
  const res = await fetch('/api/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: document.getElementById('reg-username').value, password: document.getElementById('reg-password').value })
  });
  const data = await res.json();
  alert(data.msg);
  if (data.ok) location.reload();
}

async function doLogin() {
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: document.getElementById('login-username').value, password: document.getElementById('login-password').value })
  });
  const data = await res.json();
  if (data.ok) {
    location.reload();
  } else {
    alert(data.msg);
    if (data.need_totp) document.getElementById('login-totp').style.display = 'block';
  }
}

async function doLogout() {
  await fetch('/api/logout', { method: 'POST' });
  location.reload();
}

async function loadModels() {
  const res = await fetch('/api/models');
  const data = await res.json();
  if (data.ok) {
    const sel = document.getElementById('model-select');
    sel.innerHTML = '';
    data.data.forEach(m => { const o = document.createElement('option'); o.value = m.id; o.textContent = m.name; sel.appendChild(o); });
  }
}

async function sendMessage() {
  const input = document.getElementById('message-input');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  const box = document.getElementById('chat-box');
  box.innerHTML += `<div class="msg user">${escapeHtml(msg)}</div>`;
  box.innerHTML += `<div class="msg ai" id="ai-reply">思考中...</div>`;
  box.scrollTop = box.scrollHeight;
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: msg, model: document.getElementById('model-select').value })
  });
  const data = await res.json();
  if (data.ok) {
    document.getElementById('ai-reply').textContent = data.reply;
  } else {
    document.getElementById('ai-reply').textContent = '错误：' + data.msg;
  }
  box.scrollTop = box.scrollHeight;
}

async function loadKeys() {
  const res = await fetch('/api/apikeys');
  const data = await res.json();
  if (data.ok) {
    const list = document.getElementById('keys-list');
    list.innerHTML = '';
    data.data.forEach(k => {
      const div = document.createElement('div');
      div.className = 'key-item';
      div.innerHTML = `<div><code>${k.key.slice(0, 20)}...</code><br><small>已用 ${k.used_tokens || 0} / ${k.token_limit || 100000}</small></div><button class="delete-btn" onclick="deleteKey('${k.key}')">删除</button>`;
      list.appendChild(div);
    });
  }
}

async function createKey() {
  const name = document.getElementById('key-name').value;
  const res = await fetch('/api/apikeys', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name })
  });
  const data = await res.json();
  if (data.ok) { alert('Key: ' + data.key); loadKeys(); }
  else alert(data.msg);
}

async function deleteKey(key) {
  if (!confirm('确定删除？')) return;
  await fetch('/api/apikeys/delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key })
  });
  loadKeys();
}

async function redeemGift() {
  const code = document.getElementById('gift-code').value;
  const res = await fetch('/api/gift', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code })
  });
  const data = await res.json();
  alert(data.msg);
}

async function setup2FA() {
  const res = await fetch('/api/2fa/setup', { method: 'POST' });
  const data = await res.json();
  if (data.ok) {
    document.getElementById('2fa-result').innerHTML = `<p>密钥: <code>${data.secret}</code></p><p>扫码: <code>${data.otpauth}</code></p><p><button onclick="verify2FA()">验证</button></p>`;
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
</script>
</body>
</html>
