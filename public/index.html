<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-CHAT</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e5e7eb; min-height: 100vh; }
.container { max-width: 900px; margin: 0 auto; padding: 20px; }
h1 { text-align: center; margin-bottom: 20px; color: #fff; }
h3 { color: #e5e7eb; margin-bottom: 12px; }
.card { background: #1a1d27; border-radius: 12px; padding: 24px; margin-bottom: 20px; border: 1px solid #2a2d3a; }
input, button, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #2a2d3a; background: #0f1117; color: #e5e7eb; font-size: 16px; margin-bottom: 12px; }
button { background: #4f6ef7; color: #fff; border: none; cursor: pointer; font-weight: 600; transition: background 0.2s; }
button:hover { background: #3b5de7; }
button.danger { background: #ef4444; }
button.danger:hover { background: #dc2626; }
.tabs { display: flex; gap: 8px; margin-bottom: 20px; }
.tabs button { flex: 1; padding: 10px; border-radius: 8px; background: #1a1d27; color: #9ca3af; border: 1px solid #2a2d3a; }
.tabs button.active { background: #4f6ef7; color: #fff; border-color: #4f6ef7; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.chat-box { background: #0f1117; border-radius: 8px; padding: 16px; height: 400px; overflow-y: auto; margin-bottom: 12px; border: 1px solid #2a2d3a; }
.msg { margin-bottom: 12px; padding: 10px 14px; border-radius: 8px; max-width: 80%; word-wrap: break-word; }
.msg.user { background: #4f6ef7; color: #fff; margin-left: auto; }
.msg.ai { background: #1a1d27; border: 1px solid #2a2d3a; }
.msg pre { background: #0f1117; padding: 10px; border-radius: 6px; overflow-x: auto; margin-top: 8px; }
.key-item { display: flex; align-items: center; gap: 10px; padding: 12px; background: #0f1117; border-radius: 8px; margin-bottom: 8px; border: 1px solid #2a2d3a; }
.key-item code { flex: 1; font-family: monospace; font-size: 14px; color: #a5b4fc; word-break: break-all; }
.key-item span { font-size: 14px; color: #9ca3af; white-space: nowrap; }
.error { color: #ef4444; font-size: 14px; margin-bottom: 10px; }
.success { color: #22c55e; font-size: 14px; margin-bottom: 10px; }
#main-page { display: none; }
#login-page { display: block; max-width: 400px; margin: 80px auto; }
.logout-btn { position: fixed; top: 20px; right: 20px; width: auto; padding: 8px 16px; font-size: 14px; z-index: 100; }
a { color: #4f6ef7; text-decoration: none; }
a:hover { text-decoration: underline; }
</style>
</head>
<body>

<!-- 登录页 -->
<div id="login-page" class="container">
  <div class="card">
    <h1 id="form-title">AI-CHAT 登录</h1>
    <div id="msg"></div>
    <div id="login-form">
      <input id="username" placeholder="用户名">
      <input id="password" type="password" placeholder="密码">
      <input id="totp-code" type="password" placeholder="2FA验证码（如已开启）" style="display:none">
      <button onclick="doLogin()">登录</button>
      <button onclick="toggleForm()">没有账号？注册</button>
    </div>
    <div id="register-form" style="display:none">
      <input id="reg-username" placeholder="用户名">
      <input id="reg-password" type="password" placeholder="密码">
      <button onclick="doRegister()">注册</button>
      <button onclick="toggleForm()">已有账号？去登录</button>
    </div>
    <div style="text-align:center; margin-top:16px; padding-top:16px; border-top:1px solid #2a2d3a;">
      <a href="/auth/start">使用 GitHub 登录</a>
    </div>
  </div>
</div>

<!-- 主界面 -->
<div id="main-page" class="container">
  <button class="logout-btn danger" onclick="doLogout()">退出</button>
  <h1>AI-CHAT</h1>
  <p style="text-align:center;color:#9ca3af;margin-bottom:20px">欢迎, <span id="username-display"></span></p>

  <div class="tabs">
    <button id="tab-chat" class="active" onclick="switchTab('chat')">聊天</button>
    <button id="tab-keys" onclick="switchTab('keys')">API Keys</button>
    <button id="tab-gift" onclick="switchTab('gift')">礼品码</button>
  </div>

  <!-- 聊天 -->
  <div id="chat" class="tab-content active">
    <div class="card">
      <div class="chat-box" id="chat-box"></div>
      <div style="display:flex;gap:8px">
        <input id="chat-input" placeholder="输入消息..." style="margin-bottom:0" onkeydown="if(event.key==='Enter')doChat()">
        <button onclick="doChat()" style="width:auto;padding:12px 24px;margin-bottom:0">发送</button>
      </div>
    </div>
  </div>

  <!-- API Keys -->
  <div id="keys" class="tab-content">
    <div class="card">
      <h3>我的 API Keys</h3>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <input id="key-name" placeholder="Key 名称（可选）" style="margin-bottom:0">
        <button onclick="createKey()" style="width:auto;margin-bottom:0">创建 API Key</button>
      </div>
      <div id="key-list"></div>
    </div>
  </div>

  <!-- 礼品码 -->
  <div id="gift" class="tab-content">
    <div class="card">
      <h3>兑换礼品码</h3>
      <div style="display:flex;gap:8px">
        <input id="gift-code" placeholder="输入礼品码" style="margin-bottom:0">
        <button onclick="redeemGift()" style="width:auto;margin-bottom:0">兑换</button>
      </div>
    </div>
  </div>
</div>

<script>
// ========== 初始化 ==========
const TOKEN = new URLSearchParams(location.search).get('t');

if (!TOKEN) {
  document.getElementById('login-page').style.display = 'block';
  document.getElementById('main-page').style.display = 'none';
} else {
  document.getElementById('login-page').style.display = 'none';
  fetch('/api/me?t=' + TOKEN)
    .then(r => r.json())
    .then(data => {
      if (data.ok) {
        document.getElementById('main-page').style.display = 'block';
        document.getElementById('username-display').textContent = data.user.username;
        loadKeys();
      } else {
        document.getElementById('login-page').style.display = 'block';
      }
    })
    .catch(() => {
      document.getElementById('login-page').style.display = 'block';
    });
}

// ========== 登录/注册切换 ==========
function toggleForm() {
  const lf = document.getElementById('login-form');
  const rf = document.getElementById('register-form');
  const title = document.getElementById('form-title');
  if (lf.style.display !== 'none') {
    lf.style.display = 'none'; rf.style.display = 'block';
    title.textContent = '注册';
  } else {
    lf.style.display = 'block'; rf.style.display = 'none';
    title.textContent = 'AI-CHAT 登录';
  }
  document.getElementById('msg').innerHTML = '';
}

// ========== 注册 ==========
function doRegister() {
  const msg = document.getElementById('msg');
  const username = document.getElementById('reg-username').value.trim();
  const password = document.getElementById('reg-password').value;
  if (!username || !password) { msg.innerHTML = '<p class="error">用户名和密码不能为空</p>'; return; }
  fetch('/api/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  })
  .then(r => r.json())
  .then(d => {
    if (d.ok) { msg.innerHTML = '<p class="success">注册成功，请登录</p>'; toggleForm(); }
    else msg.innerHTML = '<p class="error">' + d.msg + '</p>';
  })
  .catch(() => { msg.innerHTML = '<p class="error">网络错误</p>'; });
}

// ========== 登录 ==========
function doLogin() {
  const msg = document.getElementById('msg');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const totp = document.getElementById('totp-code').value;
  if (!username || !password) { msg.innerHTML = '<p class="error">用户名和密码不能为空</p>'; return; }
  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password, totp_code: totp })
  })
  .then(r => r.json())
  .then(d => {
    if (d.ok) {
      location.href = '/?t=' + d.token;
    } else {
      if (d.need_totp) {
        document.getElementById('totp-code').style.display = 'block';
        msg.innerHTML = '<p class="error">' + d.msg + '</p>';
      } else {
        msg.innerHTML = '<p class="error">' + d.msg + '</p>';
      }
    }
  })
  .catch(() => { msg.innerHTML = '<p class="error">网络错误</p>'; });
}

// ========== 登出 ==========
function doLogout() {
  fetch('/api/logout?t=' + TOKEN, { method: 'POST' })
    .then(() => { location.href = '/'; })
    .catch(() => { location.href = '/'; });
}

// ========== Tab 切换 ==========
function switchTab(name) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  document.getElementById(name).classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'keys') loadKeys();
}

// ========== 聊天 ==========
function doChat() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  const box = document.getElementById('chat-box');
  box.innerHTML += '<div class="msg user">' + escapeHtml(text) + '</div>';
  input.value = '';
  box.scrollTop = box.scrollHeight;

  const loadingId = 'msg-' + Date.now();
  box.innerHTML += '<div class="msg ai" id="' + loadingId + '"><span style="color:#9ca3af">思考中...</span></div>';
  box.scrollTop = box.scrollHeight;

  fetch('/api/chat?t=' + TOKEN, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text })
  })
  .then(r => r.json())
  .then(d => {
    document.getElementById(loadingId).innerHTML = d.reply ? renderMarkdown(d.reply) : '<span style="color:#ef4444">请求失败，请重试</span>';
    box.scrollTop = box.scrollHeight;
  })
  .catch(() => {
    document.getElementById(loadingId).innerHTML = '<span style="color:#ef4444">网络错误</span>';
  });
}

// ========== API Keys ==========
function loadKeys() {
  fetch('/api/apikeys?t=' + TOKEN)
    .then(r => r.json())
    .then(d => {
      const list = document.getElementById('key-list');
      if (!d.ok || !d.data || d.data.length === 0) { list.innerHTML = '<p style="color:#9ca3af">暂无 API Key，创建一个吧</p>'; return; }
      list.innerHTML = d.data.map(k => '<div class="key-item"><code>' + k.key + '</code><span>已用: ' + (k.used_tokens||0) + '/' + (k.token_limit||100000) + '</span><button class="danger" style="width:auto;padding:6px 12px;margin:0" onclick="deleteKey(\'' + k.key + '\')">删除</button></div>').join('');
    })
    .catch(() => { document.getElementById('key-list').innerHTML = '<p class="error">加载失败</p>'; });
}

function createKey() {
  const name = document.getElementById('key-name').value.trim();
  fetch('/api/apikeys?t=' + TOKEN, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name || 'default' })
  })
  .then(r => r.json())
  .then(d => { if (d.ok) { document.getElementById('key-name').value = ''; loadKeys(); } })
  .catch(() => alert('创建失败'));
}

function deleteKey(key) {
  if (!confirm('确定删除这个 API Key？')) return;
  fetch('/api/apikeys/delete?t=' + TOKEN, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key })
  })
  .then(r => r.json())
  .then(d => { if (d.ok) loadKeys(); })
  .catch(() => alert('删除失败'));
}

// ========== 礼品码 ==========
function redeemGift() {
  const code = document.getElementById('gift-code').value.trim();
  if (!code) return;
  fetch('/api/gift?t=' + TOKEN, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code })
  })
  .then(r => r.json())
  .then(d => { alert(d.msg); if (d.ok) document.getElementById('gift-code').value = ''; })
  .catch(() => alert('兑换失败'));
}

// ========== 工具函数 ==========
function escapeHtml(text) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
  return text.replace(/[&<>"']/g, m => map[m]);
}

function renderMarkdown(text) {
  return escapeHtml(text)
    .replace(/\n/g, '<br>')
    .replace(/```([\s\S]*?)```/g, '<pre>$1</pre>')
    .replace(/`([^`]+)`/g, '<code style="background:#0f1117;padding:2px 6px;border-radius:4px">$1</code>');
}
</script>
</body>
</html>
