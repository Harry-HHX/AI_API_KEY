<!DOCTYPE html>
<link rel="stylesheet" href="/style.css">
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-CHAT</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e5e7eb; min-height: 100vh; overflow-x: hidden; }

.topbar { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: #1a1d27; border-bottom: 1px solid #2a2d3a; display: none; align-items: center; padding: 0 16px; z-index: 200; }
.topbar .menu-btn { background: none; border: none; color: #e5e7eb; font-size: 24px; cursor: pointer; padding: 4px 8px; margin-right: 12px; }
.topbar .menu-btn:hover { background: #2a2d3a; border-radius: 8px; }
.topbar h1 { font-size: 18px; color: #fff; font-weight: 600; }

.sidebar { position: fixed; top: 0; left: 0; width: 260px; height: 100vh; background: #1a1d27; border-right: 1px solid #2a2d3a; z-index: 300; transform: translateX(-100%); transition: transform 0.3s ease; padding-top: 76px; }
.sidebar.open { transform: translateX(0); }
.sidebar .nav-item { display: flex; align-items: center; gap: 12px; padding: 14px 20px; cursor: pointer; color: #9ca3af; transition: background 0.2s, color 0.2s; font-size: 15px; }
.sidebar .nav-item:hover { background: #2a2d3a; color: #e5e7eb; }
.sidebar .nav-item.active { background: #4f6ef7; color: #fff; }
.sidebar .nav-item .icon { font-size: 18px; width: 24px; text-align: center; }
.sidebar-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 250; display: none; }
.sidebar-overlay.open { display: block; }

.main { margin-top: 56px; padding: 20px; max-width: 900px; margin-left: auto; margin-right: auto; }
.page { display: none; }
.page.active { display: block; }

.card { background: #1a1d27; border-radius: 12px; padding: 24px; margin-bottom: 20px; border: 1px solid #2a2d3a; }
h3 { color: #e5e7eb; margin-bottom: 16px; font-size: 16px; }

input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #2a2d3a; background: #0f1117; color: #e5e7eb; font-size: 16px; margin-bottom: 12px; box-sizing: border-box; }
button { padding: 12px 24px; border-radius: 8px; border: none; background: #4f6ef7; color: #fff; cursor: pointer; font-weight: 600; font-size: 16px; transition: background 0.2s; box-sizing: border-box; }
button:hover { background: #3b5de7; }
button:disabled { background: #374151; color: #6b7280; cursor: not-allowed; }
button.danger { background: #ef4444; }
button.danger:hover { background: #dc2626; }
button.github { background: #24292e; }
button.github:hover { background: #1b1f23; }

.row { display: flex; gap: 8px; align-items: center; }
.row input, .row select { margin-bottom: 0; flex: 1; }
.row button { flex-shrink: 0; }

.model-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.model-row label { color: #9ca3af; font-size: 14px; white-space: nowrap; }
.model-row select { flex: 1; margin-bottom: 0; width: auto; }

.chat-box { background: #0f1117; border-radius: 8px; padding: 16px; height: 400px; overflow-y: auto; margin-bottom: 12px; border: 1px solid #2a2d3a; }
.msg { margin-bottom: 12px; padding: 10px 14px; border-radius: 8px; max-width: 80%; word-wrap: break-word; }
.msg.user { background: #4f6ef7; color: #fff; margin-left: auto; }
.msg.ai { background: #1a1d27; border: 1px solid #2a2d3a; }

.key-item { display: flex; align-items: center; gap: 10px; padding: 12px; background: #0f1117; border-radius: 8px; margin-bottom: 8px; border: 1px solid #2a2d3a; }
.key-item code { flex: 1; font-family: monospace; font-size: 14px; color: #a5b4fc; word-break: break-all; }
.key-item span { font-size: 14px; color: #9ca3af; white-space: nowrap; }
.key-limit { color: #9ca3af; font-size: 13px; margin-bottom: 12px; }

.account-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #2a2d3a; }
.account-row:last-child { border-bottom: none; }
.account-row label { color: #9ca3af; font-size: 14px; }
.account-row .value { color: #e5e7eb; font-size: 14px; }

#login-page { max-width: 400px; margin: 100px auto; padding: 20px; }
.error-msg { color: #ef4444; font-size: 14px; margin-bottom: 10px; display: none; }
.success-msg { color: #22c55e; font-size: 14px; margin-bottom: 10px; display: none; }
.switch-link { color: #4f6ef7; cursor: pointer; font-size: 14px; text-align: center; margin-top: 12px; display: block; }
.switch-link:hover { text-decoration: underline; }

.gift-row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
.gift-row input { margin-bottom: 0; flex: 1; }
</style>
</head>
<body>

<div class="topbar" id="topbar">
  <button class="menu-btn" onclick="toggleSidebar()">&#9776;</button>
  <h1>AI-CHAT</h1>
</div>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebar">
  <div class="nav-item active" onclick="navigate('chat', this)">
    <span class="icon">&#128172;</span> 聊天
  </div>
  <div class="nav-item" onclick="navigate('keys', this)">
    <span class="icon">&#128273;</span> 我的 API Key
  </div>
  <div class="nav-item" onclick="navigate('gift', this)">
    <span class="icon">&#127873;</span> 礼品码
  </div>
  <div class="nav-item" onclick="navigate('account', this)">
    <span class="icon">&#128100;</span> 我的账户
  </div>
</div>

<!-- 登录/注册 -->
<div id="login-page" class="page active">
  <div class="card" id="login-card">
    <h3 style="text-align:center">AI-CHAT 登录</h3>
    <div class="error-msg" id="login-error"></div>
    <input id="login-username" placeholder="用户名">
    <input id="login-password" type="password" placeholder="密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()" style="width:100%">登录</button>
    <span class="switch-link" onclick="showRegister()">没有账号？注册</span>
    <button class="github" onclick="doGithubLogin()" style="width:100%;margin-top:12px">使用 GitHub 登录</button>
  </div>
  <div class="card" id="register-card" style="display:none">
    <h3 style="text-align:center">注册</h3>
    <div class="error-msg" id="register-error"></div>
    <div class="success-msg" id="register-success"></div>
    <input id="reg-username" placeholder="用户名">
    <input id="reg-password" type="password" placeholder="密码">
    <input id="reg-2fa" placeholder="2FA 密钥（可选）">
    <button onclick="doRegister()" style="width:100%">注册</button>
    <span class="switch-link" onclick="showLogin()">已有账号？去登录</span>
  </div>
</div>

<!-- 主内容 -->
<div class="main" id="main-content" style="display:none">

  <!-- 聊天 -->
  <div id="page-chat" class="page active">
    <div class="card">
      <div class="model-row">
        <label>选择模型：</label>
        <select id="model-select">
          <option value="llama">Meta Llama 3.1 8B Instruct</option>
          <option value="mistral">Mistral 7B Instruct</option>
          <option value="gemma">Google Gemma 2 9B</option>
          <option value="qwen">Qwen 1.5 7B Chat</option>
        </select>
      </div>
      <div class="chat-box" id="chat-box">
        <div class="msg ai">你好！我是 AI 助手，有什么可以帮你的？</div>
      </div>
      <div class="row">
        <input id="chat-input" placeholder="输入消息..." onkeydown="if(event.key==='Enter')doChat()">
        <button onclick="doChat()">发送</button>
      </div>
    </div>
  </div>

  <!-- API Keys -->
  <div id="page-keys" class="page">
    <div class="card">
      <h3>我的 API Keys</h3>
      <p class="key-limit" id="key-limit-text">加载中...</p>
      <div class="row" style="margin-bottom:12px">
        <input id="key-name" placeholder="Key 名称（可选）">
        <button onclick="createKey()" id="create-key-btn">创建</button>
      </div>
      <div id="key-list"><p style="color:#9ca3af">加载中...</p></div>
    </div>
  </div>

  <!-- 礼品码 -->
  <div id="page-gift" class="page">
    <div class="card">
      <h3>兑换礼品码</h3>
      <div class="gift-row">
        <input id="gift-code" placeholder="输入礼品码">
        <button onclick="redeemGift()">兑换</button>
      </div>
      <p id="gift-msg" style="margin-top:10px;font-size:14px"></p>
    </div>
  </div>

  <!-- 账户 -->
  <div id="page-account" class="page">
    <div class="card">
      <h3>欢迎, <span id="account-username">-</span></h3>
      <div class="account-row">
        <label>Token 用量</label>
        <span class="value" id="account-tokens">47,231 / 100,000</span>
      </div>
      <div class="account-row">
        <label>2FA</label>
        <span class="value" id="account-2fa">-</span>
      </div>
      <div class="account-row">
        <label>注册时间</label>
        <span class="value" id="account-created">-</span>
      </div>
      <div style="margin-top:20px">
        <button class="danger" onclick="doLogout()">退出</button>
      </div>
    </div>
  </div>

</div>

<script>
// ========== 全局状态 ==========
var token = null;
var currentUser = null;
var totalCreated = 0;
var maxKeys = 3;

// ========== 统一请求函数 ==========
function request(path, options) {
  var opts = options || {};
  opts.headers = { 'Content-Type': 'application/json' };
  if (opts.body && typeof opts.body !== 'string') {
    opts.body = JSON.stringify(opts.body);
  }
  return fetch(path, opts).then(function(r) { return r.json(); });
}

// ========== 路由分发器 ==========
var api = {
  auth: {
    register: function(username, password, tfa) {
      return request('/api/register', { method: 'POST', body: { username: username, password: password, tfa: tfa } });
    },
    login: function(username, password) {
      return request('/api/login', { method: 'POST', body: { username: username, password: password } });
    },
    me: function() {
      return request('/api/me?t=' + encodeURIComponent(token), { method: 'GET' });
    }
  },
  chat: {
    send: function(message, model) {
      return request('/api/chat', { method: 'POST', body: { message: message, model: model, token: token } });
    }
  },
  keys: {
    list: function() {
      return request('/api/keys/list?t=' + encodeURIComponent(token), { method: 'GET' });
    },
    create: function(name) {
      return request('/api/keys/create', { method: 'POST', body: { token: token, name: name } });
    },
    delete: function(id) {
      return request('/api/keys/delete/' + id + '?t=' + encodeURIComponent(token), { method: 'DELETE' });
    }
  },
  gift: {
    redeem: function(code) {
      return request('/api/gift/redeem', { method: 'POST', body: { token: token, code: code } });
    }
  }
};

// ========== 初始化 ==========
(function init() {
  var params = new URLSearchParams(window.location.search);
  token = params.get('t');
  if (token) {
    checkAuth();
  } else {
    showLoginPage();
  }
})();

function showLoginPage() {
  document.getElementById('login-page').style.display = 'block';
  document.getElementById('login-page').classList.add('active');
  document.getElementById('main-content').style.display = 'none';
  document.getElementById('topbar').style.display = 'none';
}

function showMainPage() {
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('login-page').classList.remove('active');
  document.getElementById('main-content').style.display = 'block';
  document.getElementById('topbar').style.display = 'flex';
  loadKeys();
  loadAccount();
}

// ========== 登录/注册 ==========
function showLogin() {
  document.getElementById('login-card').style.display = 'block';
  document.getElementById('register-card').style.display = 'none';
}
function showRegister() {
  document.getElementById('login-card').style.display = 'none';
  document.getElementById('register-card').style.display = 'block';
}

function checkAuth() {
  api.auth.me().then(function(data) {
    if (data.ok) {
      currentUser = data.user;
      showMainPage();
    } else {
      token = null;
      showLoginPage();
    }
  }).catch(function() { showLoginPage(); });
}

function doLogin() {
  var username = document.getElementById('login-username').value.trim();
  var password = document.getElementById('login-password').value;
  var err = document.getElementById('login-error');
  err.style.display = 'none';
  if (!username || !password) { err.textContent = '请填写用户名和密码'; err.style.display = 'block'; return; }

  api.auth.login(username, password).then(function(data) {
    if (data.ok) {
      token = data.token;
      window.history.replaceState(null, '', '/?t=' + data.token);
      checkAuth();
    } else {
      err.textContent = data.msg || '登录失败';
      err.style.display = 'block';
    }
  });
}

function doRegister() {
  var username = document.getElementById('reg-username').value.trim();
  var password = document.getElementById('reg-password').value;
  var tfa = document.getElementById('reg-2fa').value.trim();
  var err = document.getElementById('register-error');
  var suc = document.getElementById('register-success');
  err.style.display = 'none'; suc.style.display = 'none';
  if (!username || !password) { err.textContent = '请填写用户名和密码'; err.style.display = 'block'; return; }

  api.auth.register(username, password, tfa).then(function(data) {
    if (data.ok) {
      suc.textContent = '注册成功！请登录';
      suc.style.display = 'block';
      setTimeout(showLogin, 1200);
    } else {
      err.textContent = data.msg || '注册失败';
      err.style.display = 'block';
    }
  });
}

function doLogout() {
  token = null;
  window.history.replaceState(null, '', '/');
  showLoginPage();
}

function doGithubLogin() {
  window.location.href = '/api/auth/github';
}

// ========== 侧边栏 ==========
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
}

function navigate(page, el) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });
  if (el) el.classList.add('active');
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}

// ========== 聊天 ==========
function doChat() {
  var input = document.getElementById('chat-input');
  var text = input.value.trim();
  if (!text) return;
  var sel = document.getElementById('model-select');
  var model = sel.value;
  var modelName = sel.options[sel.selectedIndex].text;
  var box = document.getElementById('chat-box');
  box.innerHTML += '<div class="msg user">' + escapeHtml(text) + '</div>';
  input.value = '';
  box.scrollTop = box.scrollHeight;

  var loadingId = 'msg-' + Date.now();
  box.innerHTML += '<div class="msg ai" id="' + loadingId + '"><span style="color:#9ca3af">[' + escapeHtml(modelName) + '] 思考中...</span></div>';
  box.scrollTop = box.scrollHeight;

  api.chat.send(text, model).then(function(data) {
    if (data.ok) {
      document.getElementById(loadingId).innerHTML = '<span style="color:#9ca3af">[' + escapeHtml(modelName) + ']</span><br>' + escapeHtml(data.reply);
    } else {
      document.getElementById(loadingId).innerHTML = '<span style="color:#ef4444">请求失败：' + escapeHtml(data.msg || '未知错误') + '</span>';
    }
    box.scrollTop = box.scrollHeight;
  }).catch(function() {
    document.getElementById(loadingId).innerHTML = '<span style="color:#ef4444">网络错误</span>';
  });
}

// ========== API Keys ==========
function loadKeys() {
  api.keys.list().then(function(data) {
    var list = document.getElementById('key-list');
    var limitText = document.getElementById('key-limit-text');
    if (data.ok) {
      totalCreated = data.keys.length;
      limitText.textContent = '已创建 ' + totalCreated + ' / ' + maxKeys + ' 个（含已删除）';
      if (totalCreated >= maxKeys) {
        document.getElementById('create-key-btn').disabled = true;
        document.getElementById('create-key-btn').textContent = '已达上限';
      }
      if (data.keys.length === 0) {
        list.innerHTML = '<p style="color:#9ca3af">暂无 API Key，创建一个吧</p>';
      } else {
        list.innerHTML = '';
        data.keys.forEach(function(k) {
          var div = document.createElement('div');
          div.className = 'key-item';
          div.innerHTML = '<code>' + k.key_value + '</code><span>' + (k.name || 'default') + '</span><button class="danger" onclick="deleteKey(' + k.id + ')">删除</button>';
          list.appendChild(div);
        });
      }
    } else {
      list.innerHTML = '<p style="color:#ef4444">加载失败</p>';
    }
  });
}

function createKey() {
  if (totalCreated >= maxKeys) {
    alert('最多只能创建 ' + maxKeys + ' 个 API Key（含已删除的），不能做公益哦 😏');
    return;
  }
  var name = document.getElementById('key-name').value.trim();
  api.keys.create(name).then(function(data) {
    if (data.ok) {
      document.getElementById('key-name').value = '';
      loadKeys();
    } else {
      alert(data.msg || '创建失败');
    }
  });
}

function deleteKey(id) {
  if (!confirm('确定删除这个 API Key？')) return;
  api.keys.delete(id).then(function(data) {
    if (data.ok) { loadKeys(); }
    else { alert(data.msg || '删除失败'); }
  });
}

// ========== 礼品码 ==========
function redeemGift() {
  var code = document.getElementById('gift-code').value.trim();
  var msg = document.getElementById('gift-msg');
  if (!code) { msg.style.color = '#ef4444'; msg.textContent = '请输入礼品码'; return; }
  api.gift.redeem(code).then(function(data) {
    if (data.ok) {
      msg.style.color = '#22c55e';
      msg.textContent = data.msg || '兑换成功！';
      document.getElementById('gift-code').value = '';
    } else {
      msg.style.color = '#ef4444';
      msg.textContent = data.msg || '兑换失败';
    }
  });
}

// ========== 账户 ==========
function loadAccount() {
  if (!currentUser) return;
  document.getElementById('account-username').textContent = currentUser.username || '-';
  document.getElementById('account-2fa').textContent = currentUser.tfa_enabled ? '已绑定' : '未绑定';
  var created = currentUser.created_at;
  if (created) {
    var d = new Date(created);
    document.getElementById('account-created').textContent = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  } else {
    document.getElementById('account-created').textContent = '-';
  }
}

// ========== 工具 ==========
function escapeHtml(text) {
  var map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
  return text.replace(/[&<>"']/g, function(m) { return map[m]; });
}
</script>
</body>
</html>
